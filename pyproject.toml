[project]
name = "agent-learning"
version = "0.1.0"
description = "从普通开发转向 AI Agent 开发的练习"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=2.5.5",
    "openai>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
]
